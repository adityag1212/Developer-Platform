name: Promote Image

on:
  workflow_run:
    workflows:
      - Container
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  promote:
    name: Promote Image to Dev
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'

    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Update development image tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/applications/demo-app/values-dev.yaml")
          content = path.read_text()

          content, count = re.subn(
              r'(?m)^(\s*tag:\s*).*$',
              rf'\g<1>"{os.environ["IMAGE_TAG"]}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not find image tag in values-dev.yaml")

          path.write_text(content)
          PY

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/applications/demo-app/values-dev.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit \
            -m "chore: promote demo-service ${IMAGE_TAG}"

          git push origin develop