name: GitOps Validation

on:
  pull_request:
    paths:
      - "gitops/**"
      - "platform/helm/**"

  push:
    branches:
      - develop
      - main
    paths:
      - "gitops/**"
      - "platform/helm/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint platform/helm/application

      - name: Render development manifests
        run: |
          helm template demo-app \
            platform/helm/application \
            --values gitops/applications/demo-app/values-dev.yaml

      - name: Render staging manifests
        run: |
          helm template demo-app \
            platform/helm/application \
            --values gitops/applications/demo-app/values-staging.yaml

      - name: Render production manifests
        run: |
          helm template demo-app \
            platform/helm/application \
            --values gitops/applications/demo-app/values-prod.yaml

      - name: Install kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            -o kubeconform.tar.gz

          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate development manifests
        run: |
          helm template demo-app \
            platform/helm/application \
            --values gitops/applications/demo-app/values-dev.yaml |
            kubeconform -strict -summary

      - name: Validate staging manifests
        run: |
          helm template demo-app \
            platform/helm/application \
            --values gitops/applications/demo-app/values-staging.yaml |
            kubeconform -strict -summary

      - name: Validate production manifests
        run: |
          helm template demo-app \
            platform/helm/application \
            --values gitops/applications/demo-app/values-prod.yaml |
            kubeconform -strict -summary