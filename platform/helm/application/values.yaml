replicaCount: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  path: /health
  readinessPath: /ready
  livenessPath: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

env: []

podAnnotations: {}

podLabels: {}

terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

topologySpreadConstraints: []

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  path: /
  pathType: Prefix
  tls: []

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: true

  ingress:
    - from:
        - namespaceSelector: {}

      ports:
        - protocol: TCP
          port: 8080

  egress: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1