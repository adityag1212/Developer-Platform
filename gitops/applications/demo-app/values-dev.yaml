replicaCount: 1

image:
  repository: ghcr.io/adityag1212/demo-service
  tag: "ed3dfa8af31f5551cb6355b13c27c3d7fab6f10c"
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

health:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false

autoscaling:
  enabled: false

networkPolicy:
  enabled: true

serviceAccount:
  create: true