replicaCount: 2

image:
  repository: ghcr.io/adityag1212/demo-service
  tag: "REPLACE_ME"
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

health:
  path: /health
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

serviceAccount:
  create: true