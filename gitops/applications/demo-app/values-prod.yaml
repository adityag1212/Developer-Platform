replicaCount: 3

image:
  repository: ghcr.io/adityag1212/demo-service
  tag: "REPLACE_ME"
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

health:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

serviceAccount:
  create: true